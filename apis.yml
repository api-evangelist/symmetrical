name: Symmetrical
description: >-
  Symmetrical.ai is a Polish-British HR and payroll fintech, founded in 2019 in
  Warsaw with offices in London and Barcelona and backed by Partech. It provides
  payroll and HR bureau outsourcing plus an HR platform automating wage
  calculation, digital document management, onboarding, leave and time tracking,
  and real-time analytics, alongside employee financial wellbeing tools such as
  earned-wage / salary-on-demand access. Symmetrical is ISO/IEC 27001 certified.
  The company operates an authentication-gated developer documentation portal
  (developer.symmetrical.ai) but publishes no public OpenAPI, API reference, or
  SDKs; this profile captures its public identity plus probed security posture.
